# Site settings
title: "Harvee: Read Between the Beats"
description: "Stress Monitor & Recovery Companion"
url: "https://harvee.app"
baseurl: ""

# Analytics / Search Console
google_analytics: "G-7VD9JRQVGR"
google_site_verification: "prtEYsT9vqrzuqVht0Dop6DX382az0CO8GHqONa3iU8"

# Author information
author:
  name: "Artie"
  email: "artie@harvee.app"
  twitter: "@harveeapp"

# App Store (pSEO structured data, Smart App Banners)
app_store_id: "6746194884"
app_store_url: "https://apps.apple.com/us/app/id6746194884"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /blog/:title
timezone: "America/New_York"

# Blog settings
blog:
  title: "Solving the puzzle of resilience"
  description: "Insights on stress, recovery, and health optimization"
  paginate: 5
  paginate_path: "/blog/page:num"

# Collections
collections:
  pages:
    output: true
    permalink: /:path/
  pseo:
    output: true
    permalink: /:collection/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Harvee Team"
      show_reading_time: true
  - scope:
      path: "blog"
      type: "pages"
    values:
      layout: "blog"
  - scope:
      path: ""
      type: pseo
    values:
      layout: pseo
      indexable: false
      medical_disclaimer: true

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-archives

jekyll-archives:
  enabled:
    - tags
  layouts:
    tag: tag
  permalinks:
    tag: /blog/tags/:name/

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
  - LICENSE
  - .gitignore
  - .sass-cache/
  - .jekyll-cache/
  - .jekyll-metadata
  - _site/
  - .bundle/
  - run-jekyll.sh
